<style>
:root{--bg:#080B10;--card:#111722;--blue:#287BFF;--cyan:#00D9FF;--gold:#F5C451;--tx:#F5F7FA;--tx2:#A7B0C0;--bd:#1E2837;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(8,11,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em}.brand img{height:42px;width:auto}
nav ul{display:flex;gap:20px;list-style:none;margin:0;padding:0}nav a{color:var(--tx2);font-size:14px}nav a:hover,nav a.on{color:var(--cyan)}
.menu{display:none;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:15px}
.btn{display:inline-block;border:0;cursor:pointer;font:600 15px system-ui;padding:11px 20px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#021018;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.o{background:none;border:1px solid var(--bd);color:var(--tx)}.btn.o:hover{border-color:var(--cyan)}.btn.g{background:none;border:1px solid var(--gold);color:var(--gold)}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
h1{font-size:clamp(32px,6vw,56px);line-height:1.1;margin:.2em 0}h2{font-size:clamp(24px,4vw,34px);margin:0 0 8px}
.hero{padding:64px 0;display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
.sub{color:var(--tx2);font-size:18px}.tag{color:var(--gold);letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}section{padding:44px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}
.card:hover{border-color:#2c3c55}.card.bot{border-top:3px solid var(--gold)}.card.ag{border-top:3px solid var(--cyan)}
.mock{height:150px;border-radius:12px;background:linear-gradient(160deg,#0c1422,#152236);border:1px dashed #2a3a54;position:relative;overflow:hidden;padding:12px}
.mock i{position:absolute;bottom:0;width:9%;background:linear-gradient(var(--cyan),var(--blue));opacity:.7;border-radius:3px 3px 0 0}
.mock small{position:absolute;top:8px;left:10px;color:var(--tx2);font-size:11px}
.price{font-size:30px;font-weight:800;color:var(--cyan)}.old{text-decoration:line-through;color:var(--tx2);margin-right:8px}
.badge{align-self:flex-start;background:rgba(245,196,81,.12);color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
ul.f{margin:0;padding-left:18px;color:var(--tx2)}.muted{color:var(--tx2)}.note{background:#1a1608;border:1px solid #4a3d12;color:#e8d9a0;border-radius:10px;padding:10px 14px;font-size:14px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.steps div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;counter-increment:s}.steps div:before{content:counter(s);color:var(--gold);font-weight:800;display:block;font-size:22px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin:10px 0}summary{cursor:pointer;font-weight:600}
input,textarea,select{width:100%;background:#0b111a;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;font:inherit;margin:4px 0 10px}label{font-size:14px;color:var(--tx2)}
.err{color:#ff8a8a;font-size:13px;margin:-6px 0 8px}.ok{color:#7ee0a0}
footer{border-top:1px solid var(--bd);margin-top:40px;padding:32px 0;color:var(--tx2);font-size:14px}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.logo-big{width:100%;max-width:360px;margin:auto;display:block;border-radius:50%}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding:36px 0}.menu{display:block}nav{display:none;position:absolute;left:0;right:0;top:64px;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 20px}nav.open{display:block}nav ul{flex-direction:column}.nav>.btn{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@keyframes fl{50%{transform:translateY(-10px)}}@keyframes spn{to{transform:rotate(360deg)}}@keyframes shm{to{background-position:200% 0}}@keyframes brs{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.logoW{position:relative;width:min(340px,80%);margin:auto;animation:fl 5s ease-in-out infinite}.logoW:before{content:"";position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(var(--blue),var(--cyan),var(--gold),var(--blue));filter:blur(14px);opacity:.5;animation:spn 8s linear infinite}.logoW img{position:relative;width:100%;border-radius:50%;display:block}
.cand{display:flex;gap:6px;align-items:flex-end;height:60px;margin:22px 0}.cand i{flex:1;background:linear-gradient(var(--cyan),var(--blue));border-radius:3px;transform-origin:bottom;animation:brs 1.8s ease-in-out infinite}
.plan{position:relative;overflow:hidden}.plan:hover,.card:hover{transform:translateY(-5px);box-shadow:0 14px 40px rgba(0,217,255,.12)}.plan.pop{border-color:var(--gold)}.pop-t{position:absolute;top:14px;right:-32px;background:var(--gold);color:#201600;font-size:11px;font-weight:800;padding:3px 36px;transform:rotate(35deg)}
.badge{background:linear-gradient(90deg,rgba(245,196,81,.1),rgba(245,196,81,.35),rgba(245,196,81,.1));background-size:200% 100%;animation:shm 2.5s linear infinite}
.card{transition:transform .25s,border-color .25s,box-shadow .25s}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 40% at 20% 20%,rgba(40,123,255,.18),transparent),radial-gradient(35% 35% at 80% 30%,rgba(0,217,255,.12),transparent),radial-gradient(40% 40% at 50% 90%,rgba(245,196,81,.07),transparent);animation:drf 18s ease-in-out infinite alternate}@keyframes drf{to{transform:translate(4%,3%) scale(1.1)}}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--gold));z-index:30}
#app{animation:pg .5s ease both}@keyframes pg{from{opacity:0;transform:translateY(12px)}}
.hero h1 span{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--gold),var(--cyan));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:shm 6s linear infinite}
nav a{position:relative}nav a:after{content:"";position:absolute;left:0;bottom:-4px;height:2px;width:0;background:var(--cyan);transition:width .25s}nav a:hover:after,nav a.on:after{width:100%}
.btn:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .6s}.btn:hover:after{left:130%}
.tk{overflow:hidden;border-block:1px solid var(--bd);padding:10px 0;margin:6px 0}.tk div{display:flex;gap:34px;width:max-content;animation:mq 60s linear infinite;color:var(--tx2);font-size:14px}.tk:hover div{animation-play-state:paused}@keyframes mq{to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:26px 0}.stats div{text-align:center;padding:16px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}.stats b{display:block;font-size:34px;color:var(--cyan)}.stats span{color:var(--tx2);font-size:13px}
.plan.pop{animation:gl 2.6s ease-in-out infinite}@keyframes gl{50%{box-shadow:0 0 34px rgba(245,196,81,.28)}}.plan{transition:transform .15s,border-color .25s,box-shadow .25s}
.pt{position:fixed;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--cyan);opacity:.5;z-index:-1;animation:upw linear infinite}@keyframes upw{to{transform:translateY(-110vh);opacity:0}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}*{animation:none!important;transition:none!important}}

function initFx(){if(!fxOn){fxOn=1;const p=document.createElement("div");p.id="prog";document.body.appendChild(p);addEventListener("scroll",()=>{const m=document.documentElement.scrollHeight-innerHeight;p.style.width=(m>0?scrollY/m*100:0)+"%"},{passive:true});for(let i=0;i<14;i++){const d=document.createElement("i");d.className="pt";d.style.left=Math.random()*100+"%";d.style.animationDuration=(14+Math.random()*12)+"s";d.style.animationDelay=(-Math.random()*20)+"s";document.body.appendChild(d)}}
document.querySelectorAll(".cnt").forEach(el=>{const to=+el.dataset.to;let s=null;const st=t=>{s=s||t;const k=Math.min(1,(t-s)/1200);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)});
document.querySelectorAll(".plan").forEach(c=>{c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-5px)`};c.onmouseleave=()=>{c.style.transform=""}})}
